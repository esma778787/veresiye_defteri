name: veresiye_defteri
description: Bir veresiye defteri uygulaması.

publish_to: 'none' # Bu uygulamayı pub.dev'e yayınlamayacaksan

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  intl: ^0.19.0 # 📌 Tarih biçimlendirme için gerekli

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1 # ✔ En güncel sürüm

flutter:
  uses-material-design: true
